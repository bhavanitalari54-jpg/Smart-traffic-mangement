<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="Login to Smart Traffic Management and Accident Detection System"/>
  <title>Login – Smart Traffic System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

<div class="login-page">

  <!-- Animated background orbs -->
  <div style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;">
    <div style="position:absolute;top:-200px;left:-200px;width:600px;height:600px;
                background:radial-gradient(circle,rgba(123,47,247,.18) 0%,transparent 70%);
                animation:orb1 8s ease-in-out infinite alternate;"></div>
    <div style="position:absolute;bottom:-150px;right:-150px;width:500px;height:500px;
                background:radial-gradient(circle,rgba(0,212,255,.12) 0%,transparent 70%);
                animation:orb2 10s ease-in-out infinite alternate;"></div>
  </div>

  <style>
    @keyframes orb1 { from{transform:translate(0,0) scale(1)} to{transform:translate(80px,60px) scale(1.15)} }
    @keyframes orb2 { from{transform:translate(0,0) scale(1)} to{transform:translate(-60px,-40px) scale(1.1)} }
    @keyframes spin  { to { transform: rotate(360deg); } }
    .login-input-wrap { position:relative; }
    .login-input-icon {
      position:absolute;left:12px;top:50%;transform:translateY(-50%);
      color:var(--text-muted);pointer-events:none;
    }
    .login-input-wrap .form-control { padding-left:38px; }
    .password-toggle {
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      background:none;border:none;color:var(--text-muted);cursor:pointer;
      transition:color .2s;padding:0;
    }
    .password-toggle:hover { color:var(--accent); }
  </style>

  <div class="login-card" style="position:relative;z-index:1;" role="main">

    <!-- Logo -->
    <div class="login-logo">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="56" height="56" rx="16" fill="url(#llg)"/>
        <path d="M14 38L22 24l7 10 5-7 8 11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="41" cy="17" r="5" fill="#00d4ff"/>
        <path d="M36 17h3m3 0h-3m0 0V14m0 3v3" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
        <defs>
          <linearGradient id="llg" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop stop-color="#7b2ff7"/>
            <stop offset="1" stop-color="#00d4ff"/>
          </linearGradient>
        </defs>
      </svg>
      <h2><span>Smart</span>Traffic</h2>
      <p>Management &amp; Accident Detection System</p>
    </div>

    <!-- Demo hint -->
    <div class="login-hint">
      🔑 Demo credentials: &nbsp;
      <code>admin</code> / <code>traffic123</code>
    </div>

    <!-- Error message -->
    <div class="login-error" id="login-error" role="alert"></div>

    <!-- Form -->
    <form id="login-form" onsubmit="handleLogin(event)" novalidate>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="login-input-wrap">
          <span class="login-input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" id="username" name="username" class="form-control"
                 placeholder="Enter username" autocomplete="username" required
                 value="admin"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="login-input-wrap">
          <span class="login-input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
          </span>
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="Enter password" autocomplete="current-password" required
                 value="traffic123"/>
          <button type="button" class="password-toggle" id="pw-toggle"
                  onclick="togglePassword()" aria-label="Show/hide password">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        <span id="login-btn-text">Sign In →</span>
      </button>

    </form>

    <p style="text-align:center;margin-top:24px;font-size:.75rem;color:var(--text-muted);">
      Smart Traffic Management System &bull; v1.0<br/>
      <span style="color:var(--text-muted);opacity:.6;">For authorized personnel only</span>
    </p>

  </div><!-- /login-card -->
</div><!-- /login-page -->

<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn    = document.getElementById('login-btn');
  const errEl  = document.getElementById('login-error');
  const uname  = document.getElementById('username').value.trim();
  const passwd = document.getElementById('password').value;

  errEl.style.display = 'none';
  btn.disabled = true;
  document.getElementById('login-btn-text').innerHTML =
    '<span style="animation:spin 1s linear infinite;display:inline-block;margin-right:8px;">⟳</span> Signing in…';

  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: uname, password: passwd }),
    });
    const data = await resp.json();
    if (resp.ok && data.success) {
      document.getElementById('login-btn-text').innerHTML = '✓ Success!';
      setTimeout(() => window.location.href = data.redirect || '/dashboard', 600);
    } else {
      errEl.textContent = data.error || 'Invalid username or password.';
      errEl.style.display = 'block';
      btn.disabled = false;
      document.getElementById('login-btn-text').textContent = 'Sign In →';
    }
  } catch (err) {
    errEl.textContent = 'Network error. Please try again.';
    errEl.style.display = 'block';
    btn.disabled = false;
    document.getElementById('login-btn-text').textContent = 'Sign In →';
  }
}

function togglePassword() {
  const pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
}

// Start clock on login page too
setInterval(() => {
  const d = new Date();
  document.title = `${d.toLocaleTimeString('en-IN',{hour12:false})} – Login | Smart Traffic System`;
}, 1000);
</script>

</body>
</html>
